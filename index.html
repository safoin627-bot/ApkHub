<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickAPK - Simple & Instant APK Sharing</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    .drag-active { border-color: #3b82f6 !important; background-color: rgba(59, 130, 246, 0.08) !important; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3 cursor-pointer" onclick="resetFilters()">
        <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-lg shadow-blue-500/30">
          <i class="ph-bold ph-android-logo text-2xl"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight tracking-tight text-white">QuickAPK</h1>
          <p class="text-xs text-slate-400">Instant APK Upload & Share</p>
        </div>
      </div>

      <!-- Search Bar -->
      <div class="flex-1 max-w-md relative">
        <i class="ph-bold ph-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search apps or games..." 
          class="w-full bg-slate-800/80 text-sm text-slate-100 placeholder-slate-400 pl-10 pr-4 py-2 rounded-xl border border-slate-700 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition"
          oninput="handleSearch()"
        >
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-8 space-y-8">

    <!-- Upload Hero Zone -->
    <section class="bg-gradient-to-b from-slate-900 to-slate-900/50 border border-slate-800 rounded-2xl p-6 shadow-xl">
      <div class="text-center max-w-lg mx-auto mb-6">
        <h2 class="text-2xl font-extrabold text-white">Upload & Share an APK in Seconds</h2>
        <p class="text-slate-400 text-sm mt-1">Drop your APK file below to make it available for everyone to download instantly.</p>
      </div>

      <!-- Drag & Drop Box -->
      <div 
        id="dropZone"
        class="border-2 border-dashed border-slate-700 hover:border-blue-500 bg-slate-950/50 rounded-xl p-8 text-center cursor-pointer transition flex flex-col items-center justify-center gap-3 relative"
        onclick="document.getElementById('apkFileInput').click()"
        ondragover="handleDragOver(event)"
        ondragleave="handleDragLeave(event)"
        ondrop="handleDrop(event)"
      >
        <input type="file" id="apkFileInput" accept=".apk" class="hidden" onchange="handleFileSelect(event)">
        
        <div class="w-14 h-14 rounded-full bg-slate-800 flex items-center justify-center text-blue-400">
          <i class="ph-bold ph-upload-simple text-3xl"></i>
        </div>
        <div>
          <p class="text-base font-semibold text-slate-200" id="uploadStatusText">Click to upload or drag & drop an .APK file</p>
          <p class="text-xs text-slate-500 mt-1" id="fileInfoText">Supports any Android binary (.apk) file</p>
        </div>
      </div>

      <!-- Quick Auto-filled Form (Appears when file is dropped or manually toggled) -->
      <form id="uploadForm" onsubmit="publishApk(event)" class="mt-6 grid grid-cols-1 md:grid-cols-3 gap-4 pt-4 border-t border-slate-800">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">App Name</label>
          <input type="text" id="appName" placeholder="e.g. My Cool Game" required class="w-full bg-slate-800 text-sm text-slate-100 px-3 py-2 rounded-lg border border-slate-700 focus:border-blue-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Category</label>
          <select id="appCategory" class="w-full bg-slate-800 text-sm text-slate-100 px-3 py-2 rounded-lg border border-slate-700 focus:border-blue-500 focus:outline-none">
            <option value="Games">Games</option>
            <option value="Tools">Tools</option>
            <option value="Productivity">Productivity</option>
            <option value="Social">Social</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Version (Optional)</label>
          <input type="text" id="appVersion" placeholder="v1.0.0" class="w-full bg-slate-800 text-sm text-slate-100 px-3 py-2 rounded-lg border border-slate-700 focus:border-blue-500 focus:outline-none">
        </div>
        <div class="md:col-span-3 flex justify-end">
          <button type="submit" class="w-full md:w-auto bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm px-6 py-2.5 rounded-lg shadow-lg shadow-blue-600/20 transition flex items-center justify-center gap-2">
            <i class="ph-bold ph-paper-plane-right text-base"></i>
            Publish APK Now
          </button>
        </div>
      </form>
    </section>

    <!-- Filters & Feed Header -->
    <section class="space-y-4">
      <div class="flex flex-wrap items-center justify-between gap-4">
        <h3 class="text-xl font-bold text-white flex items-center gap-2">
          <i class="ph-bold ph-squares-four text-blue-500"></i>
          Available APKs
        </h3>
        
        <!-- Category Chips -->
        <div class="flex items-center gap-2 overflow-x-auto pb-1" id="categoryChips">
          <button onclick="filterCategory('All')" class="chip active-chip px-3 py-1.5 rounded-lg text-xs font-semibold bg-blue-600 text-white transition">All</button>
          <button onclick="filterCategory('Games')" class="chip px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Games</button>
          <button onclick="filterCategory('Tools')" class="chip px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Tools</button>
          <button onclick="filterCategory('Productivity')" class="chip px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Productivity</button>
          <button onclick="filterCategory('Social')" class="chip px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Social</button>
        </div>
      </div>

      <!-- APK Grid -->
      <div id="apkGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- Dynamic Cards Inserted Here -->
      </div>

      <!-- Empty State -->
      <div id="emptyState" class="hidden text-center py-12 border border-slate-800 rounded-xl">
        <i class="ph-bold ph-package text-4xl text-slate-600 mb-2"></i>
        <p class="text-slate-400 text-sm">No APKs found matching your criteria.</p>
      </div>
    </section>
  </main>

  <script>
    // Initial Starter Data
    const INITIAL_APKS = [
      {
        id: "apk-1",
        name: "Retro Arcade Dash",
        category: "Games",
        version: "v2.1.0",
        size: "14.2 MB",
        downloads: 1420,
        date: "Today",
        icon: "ph-game-controller"
      },
      {
        id: "apk-2",
        name: "Cleaner Pro Utility",
        category: "Tools",
        version: "v1.0.4",
        size: "8.5 MB",
        downloads: 890,
        date: "Yesterday",
        icon: "ph-wrench"
      },
      {
        id: "apk-3",
        name: "Focus Notes Mobile",
        category: "Productivity",
        version: "v3.0.0",
        size: "19.8 MB",
        downloads: 2310,
        date: "3 days ago",
        icon: "ph-note-pencil"
      }
    ];

    let apks = [];
    let selectedFile = null;
    let activeCategory = 'All';

    // Initialize App Data
    function init() {
      const stored = localStorage.getItem('quickapk_items');
      if (stored) {
        apks = JSON.parse(stored);
      } else {
        apks = INITIAL_APKS;
        localStorage.setItem('quickapk_items', JSON.stringify(apks));
      }
      renderGrid();
    }

    // Drag & Drop Handlers
    function handleDragOver(e) {
      e.preventDefault();
      document.getElementById('dropZone').classList.add('drag-active');
    }

    function handleDragLeave(e) {
      e.preventDefault();
      document.getElementById('dropZone').classList.remove('drag-active');
    }

    function handleDrop(e) {
      e.preventDefault();
      document.getElementById('dropZone').classList.remove('drag-active');
      if (e.dataTransfer.files && e.dataTransfer.files[0]) {
        processFile(e.dataTransfer.files[0]);
      }
    }

    function handleFileSelect(e) {
      if (e.target.files && e.target.files[0]) {
        processFile(e.target.files[0]);
      }
    }

    function processFile(file) {
      selectedFile = file;
      const cleanName = file.name.replace(/\.apk$/i, '').replace(/[-_]/g, ' ');
      document.getElementById('appName').value = cleanName;
      document.getElementById('uploadStatusText').innerText = `Selected: ${file.name}`;
      document.getElementById('fileInfoText').innerText = `Size: ${(file.size / (1024 * 1024)).toFixed(1)} MB - Ready to publish`;
    }

    // Publish New APK
    function publishApk(e) {
      e.preventDefault();
      const name = document.getElementById('appName').value.trim();
      const category = document.getElementById('appCategory').value;
      const version = document.getElementById('appVersion').value.trim() || 'v1.0';
      const size = selectedFile ? `${(selectedFile.size / (1024 * 1024)).toFixed(1)} MB` : '12.0 MB';

      if (!name) return;

      const newApk = {
        id: 'apk-' + Date.now(),
        name: name,
        category: category,
        version: version,
        size: size,
        downloads: 0,
        date: 'Just now',
        icon: category === 'Games' ? 'ph-game-controller' : category === 'Tools' ? 'ph-wrench' : category === 'Social' ? 'ph-chats' : 'ph-note-pencil'
      };

      apks.unshift(newApk);
      localStorage.setItem('quickapk_items', JSON.stringify(apks));

      // Reset form & view
      document.getElementById('uploadForm').reset();
      document.getElementById('uploadStatusText').innerText = 'Click to upload or drag & drop an .APK file';
      document.getElementById('fileInfoText').innerText = 'Supports any Android binary (.apk) file';
      selectedFile = null;

      renderGrid();
    }

    // Trigger Download Function
    function downloadApk(id, name) {
      // Find & increment download count
      const item = apks.find(a => a.id === id);
      if (item) {
        item.downloads++;
        localStorage.setItem('quickapk_items', JSON.stringify(apks));
        renderGrid();
      }

      // Generate downloadable dummy APK blob file
      const blob = new Blob([`Dummy APK Binary Payload for ${name}`], { type: 'application/vnd.android.package-archive' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${name.toLowerCase().replace(/\s+/g, '-')}.apk`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // Copy Link Helper
    function copyLink(name) {
      navigator.clipboard.writeText(window.location.href);
      alert(`Link copied for ${name}!`);
    }

    // Filters & Search
    function filterCategory(cat) {
      activeCategory = cat;
      document.querySelectorAll('#categoryChips button').forEach(btn => {
        if (btn.innerText === cat) {
          btn.className = "chip active-chip px-3 py-1.5 rounded-lg text-xs font-semibold bg-blue-600 text-white transition";
        } else {
          btn.className = "chip px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition";
        }
      });
      renderGrid();
    }

    function handleSearch() {
      renderGrid();
    }

    function resetFilters() {
      document.getElementById('searchInput').value = '';
      filterCategory('All');
    }

    // Render Grid
    function renderGrid() {
      const searchVal = document.getElementById('searchInput').value.toLowerCase();
      const grid = document.getElementById('apkGrid');
      const emptyState = document.getElementById('emptyState');

      const filtered = apks.filter(apk => {
        const matchesCategory = activeCategory === 'All' || apk.category === activeCategory;
        const matchesSearch = apk.name.toLowerCase().includes(searchVal);
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      grid.innerHTML = filtered.map(apk => `
        <div class="bg-slate-900 border border-slate-800 hover:border-slate-700 rounded-xl p-4 flex flex-col justify-between transition shadow-sm">
          <div>
            <div class="flex items-start justify-between gap-3 mb-3">
              <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-xl bg-slate-800 flex items-center justify-center text-blue-400 border border-slate-700/50">
                  <i class="ph-bold ${apk.icon} text-2xl"></i>
                </div>
                <div>
                  <h4 class="font-bold text-white text-base leading-snug line-clamp-1">${apk.name}</h4>
                  <span class="text-xs text-slate-400 font-medium">${apk.version} • ${apk.category}</span>
                </div>
              </div>
              <button onclick="copyLink('${apk.name}')" title="Copy Share Link" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800 transition">
                <i class="ph-bold ph-share-network text-lg"></i>
              </button>
            </div>
            
            <div class="flex items-center justify-between text-xs text-slate-400 border-t border-slate-800/80 pt-3 mt-3">
              <span>Size: ${apk.size}</span>
              <span>${apk.downloads.toLocaleString()} downloads</span>
            </div>
          </div>

          <button 
            onclick="downloadApk('${apk.id}', '${apk.name}')" 
            class="mt-4 w-full bg-slate-800 hover:bg-blue-600 text-slate-200 hover:text-white font-semibold text-xs py-2.5 rounded-lg border border-slate-700 hover:border-blue-500 transition flex items-center justify-center gap-2 group"
          >
            <i class="ph-bold ph-download-simple text-sm group-hover:translate-y-0.5 transition-transform"></i>
            Download APK
          </button>
        </div>
      `).join('');
    }

    // Initialize on load
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
